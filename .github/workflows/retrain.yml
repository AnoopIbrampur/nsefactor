name: Monthly model refit

on:
  schedule:
    # First Saturday of the month, after the month's data has settled.
    - cron: "0 6 1-7 * 6"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]" joblib
      - name: Restore market data cache
        uses: actions/cache@v4
        with:
          path: |
            artifacts/raw
            artifacts/data
            artifacts/models
          key: nse-panel-${{ github.run_id }}
          restore-keys: nse-panel-
      - name: Seed the panel on a cold start
        # An empty cache would otherwise send append_new_sessions all the way
        # back to 2015 and make ~2,900 requests to NSE in one run -- slow
        # enough to hit the job timeout and rude enough to risk the IP ban this
        # project has already earned once. The release asset is the same file
        # the cache would have held.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f artifacts/data/bhavcopy.parquet ]; then
            echo "Panel restored from cache."
          else
            echo "Cold start: seeding the panel from the data-snapshot release."
            mkdir -p artifacts/data
            gh release download data-snapshot \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'bhavcopy.parquet' \
              --dir artifacts/data
          fi

      - name: Refit and rebuild
        run: python scripts/daily_update.py --retrain
      - uses: actions/upload-artifact@v4
        with:
          name: volatility-demo-monthly
          path: artifacts/demo/index.html
