name: Monthly model refit

on:
  schedule:
    # First Saturday of the month, after the month's data has settled.
    - cron: "0 6 1-7 * 6"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]" joblib
      - name: Restore market data cache
        uses: actions/cache@v4
        with:
          path: |
            artifacts/raw
            artifacts/data
            artifacts/models
          key: nse-panel-${{ github.run_id }}
          restore-keys: nse-panel-
      - name: Refit and rebuild
        run: python scripts/daily_update.py --retrain
      - uses: actions/upload-artifact@v4
        with:
          name: volatility-demo-monthly
          path: artifacts/demo/index.html
