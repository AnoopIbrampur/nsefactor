[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nsefactor"
version = "0.1.0"
description = "Cross-sectional factor ranking for NSE equities, with a walk-forward evaluation that survives costs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "requests>=2.31",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
# GARCH(1,1) baseline. Only needed to reproduce the vol comparison table.
garch = ["arch>=7.0"]
dev = ["pytest>=8.0"]

[project.scripts]
nsefactor = "nsefactor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
